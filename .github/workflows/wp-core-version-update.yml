name: Update WordPress Core Version

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-wp-core:
    name: Check for new WordPress release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve latest stable WordPress version
        id: wp
        run: |
          latest=$(curl -fsSL https://api.wordpress.org/core/version-check/1.7/ \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['offers'][0]['version'])")
          if [ -z "$latest" ]; then
            echo "Failed to resolve latest WordPress version" >&2
            exit 1
          fi
          current=$(grep -oE 'wordpress-[0-9]+\.[0-9]+(\.[0-9]+)?\.zip' tools/wp-env/integration.json \
            | head -n1 | sed -E 's/wordpress-([0-9.]+)\.zip/\1/')
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update wp-env configs
        if: steps.wp.outputs.needs_update == 'true'
        run: |
          for file in tools/wp-env/development.json tools/wp-env/integration.json tools/wp-env/e2e.json; do
            sed -i -E "s|wordpress-[0-9]+\.[0-9]+(\.[0-9]+)?\.zip|wordpress-${{ steps.wp.outputs.latest }}.zip|g" "$file"
          done

      - name: Open pull request
        if: steps.wp.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/wp-core-${{ steps.wp.outputs.latest }}
          base: development
          commit-message: "chore(wp-env): bump WordPress core to ${{ steps.wp.outputs.latest }}"
          title: "chore(wp-env): bump WordPress core to ${{ steps.wp.outputs.latest }}"
          body: |
            Automated bump of the pinned WordPress core version used by all wp-env environments.

            - Previous: `${{ steps.wp.outputs.current }}`
            - Latest:   `${{ steps.wp.outputs.latest }}`

            Source: https://api.wordpress.org/core/version-check/1.7/
          labels: |
            dependencies
            run-tests
          delete-branch: true
