name: Release Package

# Builds, verifies and runs core E2E on the zip; called by deployment.yml, or dispatch to dry-run.
on:
  workflow_call:
    inputs:
      version:
        description: Version to build (x.y.z).
        required: true
        type: string
    outputs:
      tag:
        description: The version that was built.
        value: ${{ jobs.build.outputs.tag }}
  workflow_dispatch:
    inputs:
      version:
        description: Version to name the zip (x.y.z). Defaults to the plugin header's.
        required: false
        type: string

# Not github.workflow: under workflow_call that is the caller's name, and
# sharing its group would deadlock the two.
concurrency:
  group: release-package-${{ inputs.version || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 8.3 because the release build runs php-scoper, which requires PHP 8.2+. composer.json pins
      # the platform to 7.4, so the packaged dependencies are unaffected by the runtime version.
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.3
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node JS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          # No cache: it's shared with branch workflows, so a poisoned entry would feed the shipped zip.

      # The given version, or the plugin header's.
      - name: Resolve version
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$(sed -n 's/^Version: *//p' pdf.php)}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?'; then
            echo "Version '$version' is not a valid x.y.z version" >&2
            exit 1
          fi
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          echo "SOURCE_TAG=$version" >> "$GITHUB_ENV"
          echo "PACKAGE_ZIP=tmp/package/gravity-pdf-$version.zip" >> "$GITHUB_ENV"

      # Before the build, so a drifted lock or a vulnerable shipped package fails fast.
      - name: Audit dependencies
        run: bash ./tools/release/audit-dependencies.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Gravity PDF Build
        run: bash ./tools/release/build.sh "$SOURCE_TAG"

      # Unverified until the verify job passes it on as release-package.
      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-build
          path: ${{ env.PACKAGE_ZIP }}
          if-no-files-found: error
          # The zip is already compressed.
          compression-level: 0

  # A fresh runner with nothing installed, so build-job scripts can't have touched the checker or the git objects.
  verify:
    needs: build
    runs-on: ubuntu-latest
    env:
      SOURCE_TAG: ${{ needs.build.outputs.tag }}
      PACKAGE_ZIP: tmp/package/gravity-pdf-${{ needs.build.outputs.tag }}.zip
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-build
          path: tmp/package

      - name: Verify package
        run: bash ./tools/release/verify.sh "$PACKAGE_ZIP" "$SOURCE_TAG"

      # Fails on malware-like code (eval, shell exec, decoders) missing from tools/release/scan-baseline.txt.
      - name: Scan package code
        run: php ./tools/release/scan.php "$PACKAGE_ZIP" | tee -a "$GITHUB_STEP_SUMMARY"

      # Of the zip that just passed the gates, named like the R2 sidecars. Filename only, so `sha256sum -c` works beside it.
      - name: Write checksum
        run: cd "$(dirname "$PACKAGE_ZIP")" && f="$(basename "$PACKAGE_ZIP")" && sha256sum "$f" > "$f.sha256"

      - name: Generate release notes
        run: |
          {
            bash ./tools/release/changelog-notes.sh "$SOURCE_TAG"
            bash ./tools/release/compare-release-size.sh "$PACKAGE_ZIP" "$SOURCE_TAG"
            echo
            bash ./tools/release/checksum-notes.sh "$PACKAGE_ZIP"
          } | tee tmp/package/release-notes.md >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The E2E and release jobs run on other runners, so hand the verified zip on.
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: |
            ${{ env.PACKAGE_ZIP }}
            tmp/package/release-notes.md
            ${{ env.PACKAGE_ZIP }}.sha256
          if-no-files-found: error
          compression-level: 0

  # Core E2E with the zip mounted as the plugin, so packaging gaps fail before release.
  e2e-package:
    name: Playwright E2E on the zip
    needs: [build, verify]
    runs-on: ubuntu-latest
    env:
      PACKAGE_ZIP: tmp/package/gravity-pdf-${{ needs.build.outputs.tag }}.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The zip already has the scoped vendor and built assets; this is GF + test tooling.
      - name: Set up the job
        uses: ./.github/actions/setup-e2e
        with:
          php-version: 8.3
          php-coverage: none
          node-cache: yarn
          dependencies: install
          gf-license: ${{ secrets.GF_LICENSE }}

      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: tmp/package

      - name: Unpack the package
        run: bash ./tools/release/prepare-e2e-package.sh "$PACKAGE_ZIP"

      - name: Install / Setup Gravity PDF + WordPress
        run: yarn wp-env:e2e start

      - name: Run the tests
        timeout-minutes: 25
        # Every project (plain + pretty permalinks), as tests.yml.
        run: yarn test:e2e
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true
          # tests.yml owns the visual diff; the baselines are compared there.
          VISUAL: '0'

      # The plugin mount, and so WP_DEBUG_LOG, is the unpacked package.
      - name: Dump log files on failure
        if: failure()
        run: yarn wp-env:e2e run wordpress "cp" "-r" "/var/www/html/wp-content/uploads/gravity_forms/logs/" "/var/www/html/wp-content/plugins/gravity-pdf/tmp/logs"

      - name: Upload artifacts on failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: failure-artifacts-e2e-package
          path: |
            tmp/artifacts
            tmp/e2e-package/gravity-pdf/tmp
