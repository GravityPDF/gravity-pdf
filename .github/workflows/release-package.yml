name: Release Package

# Builds, then verifies the zip on a fresh runner; called by deployment.yml, or dispatch to dry-run.
# No E2E on the zip here: this branch's E2E suite is disabled (see end-to-end-tests.yml).
on:
  workflow_call:
    inputs:
      version:
        description: Version to build (x.y.z).
        required: true
        type: string
    outputs:
      tag:
        description: The version that was built.
        value: ${{ jobs.build.outputs.tag }}
  workflow_dispatch:
    inputs:
      version:
        description: Version to name the zip (x.y.z). Defaults to the plugin header's.
        required: false
        type: string

# Not github.workflow: under workflow_call that is the caller's name, and sharing its group would deadlock the two.
concurrency:
  group: release-package-${{ inputs.version || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 7.4
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node JS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      # The given version, or the plugin header's.
      - name: Resolve version
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$(sed -n 's/^Version: *//p' pdf.php)}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?'; then
            echo "Version '$version' is not a valid x.y.z version" >&2
            exit 1
          fi
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          echo "SOURCE_TAG=$version" >> "$GITHUB_ENV"
          echo "PACKAGE_ZIP=tmp/package/gravity-pdf-$version.zip" >> "$GITHUB_ENV"

      # Before the build, so a drifted lock or a vulnerable shipped package fails fast.
      - name: Audit dependencies
        run: bash ./tools/release/audit-dependencies.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Gravity PDF Build
        run: bash ./bin/build.sh "$SOURCE_TAG"

      # Unverified until the verify job passes it on as release-package.
      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-build
          path: ${{ env.PACKAGE_ZIP }}
          if-no-files-found: error
          # The zip is already compressed.
          compression-level: 0

  # A fresh runner with nothing installed, so build-job scripts can't have touched the checker or the git objects.
  verify:
    needs: build
    runs-on: ubuntu-latest
    env:
      SOURCE_TAG: ${{ needs.build.outputs.tag }}
      PACKAGE_ZIP: tmp/package/gravity-pdf-${{ needs.build.outputs.tag }}.zip
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-build
          path: tmp/package

      - name: Verify package
        run: bash ./tools/release/verify.sh "$PACKAGE_ZIP" "$SOURCE_TAG"

      # Fails on malware-like code (eval, shell exec, decoders) missing from tools/release/scan-baseline.txt.
      - name: Scan package code
        run: php ./tools/release/scan.php "$PACKAGE_ZIP" | tee -a "$GITHUB_STEP_SUMMARY"

      # Of the zip that just passed the gates, named like the R2 sidecars. Filename only, so `sha256sum -c` works beside it.
      - name: Write checksum
        run: cd "$(dirname "$PACKAGE_ZIP")" && f="$(basename "$PACKAGE_ZIP")" && sha256sum "$f" > "$f.sha256"

      - name: Generate release notes
        run: |
          {
            bash ./tools/release/changelog-notes.sh "$SOURCE_TAG"
            bash ./tools/release/compare-release-size.sh "$PACKAGE_ZIP" "$SOURCE_TAG"
            echo
            bash ./tools/release/checksum-notes.sh "$PACKAGE_ZIP"
          } | tee tmp/package/release-notes.md >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The release job runs on another runner, so hand the verified zip on.
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: |
            ${{ env.PACKAGE_ZIP }}
            tmp/package/release-notes.md
            ${{ env.PACKAGE_ZIP }}.sha256
          if-no-files-found: error
          compression-level: 0
