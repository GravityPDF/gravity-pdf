name: Coding Standards

on:
  pull_request:
    # No `opened`: a PR opened with run-tests fires `labeled` too, and the two runs would cancel each other
    types: [ reopened, synchronize, labeled ]

# A label other than run-tests gets a group of its own, so it can't cancel the run in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.event.action == 'labeled' && github.event.label.name != 'run-tests' && github.run_id || github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  # The jobs below need the run-tests label and skip without it
  check_for_run_tests_label_in_pr:
    name: Should workflow run?
    # Same label as `concurrency.group`
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'run-tests' }}
    runs-on: ubuntu-latest
    steps:
      # Read live labels via gh-api: the event payload can predate labels added alongside the trigger
      - name: Check for run-tests label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx 'run-tests'

  phpcs:
    name: PHP coding standards
    needs: check_for_run_tests_label_in_pr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 7.4
          tools: composer, cs2pr

      - name: Log debug information
        run: |
          php --version
          composer --version

      - name: Add auth details for private composer packages
        run: composer config http-basic.composer.gravity.io ${{ secrets.GF_LICENSE }} http://localhost

      - name: Install Composer dependencies
        run: |
          bash tools/ci/composer-retry.sh install --prefer-dist --no-suggest --no-progress --no-ansi --no-interaction --no-scripts
          echo "${PWD}/vendor/bin" >> $GITHUB_PATH

      - name: Log PHPCS debug information
        run: composer run phpcs:lint .

      - name: Run PHP compatibility tests
        run: composer run phpcs:compatibility .

  phpstan:
    name: PHP static analysis
    needs: check_for_run_tests_label_in_pr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The Tests workflow's prebuild job saves this entry; on a miss, build it here without saving.
      - name: Restore Composer vendor
        id: vendor-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            vendor
            vendor_prefixed
          key: vendor-${{ runner.os }}-${{ hashFiles('composer.lock', 'tools/php-scoper/**') }}

      # 8.3 because php-scoper requires PHP 8.2+. PHPStan still analyses against composer.json's 7.4 platform.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          tools: composer

      - name: Add auth details for private composer packages
        if: ${{ steps.vendor-cache.outputs.cache-hit != 'true' }}
        run: composer config http-basic.composer.gravity.io ${{ secrets.GF_LICENSE }} http://localhost

      - name: Install Composer dependencies
        if: ${{ steps.vendor-cache.outputs.cache-hit != 'true' }}
        run: |
          bash tools/ci/composer-retry.sh install --prefer-dist --no-progress --no-ansi --no-interaction --no-scripts
          composer prefix

      - name: Restore PHPStan result cache
        uses: actions/cache@v6
        with:
          path: tmp/phpstan
          key: phpstan-${{ runner.os }}-${{ github.sha }}
          restore-keys: phpstan-${{ runner.os }}-

      # The baseline may only shrink: a new finding fails, and so does a baseline entry that no longer matches.
      - name: Run PHPStan
        run: composer phpstan -- --no-progress --error-format=github

  jshint:
    name: JavaScript coding standards
    needs: check_for_run_tests_label_in_pr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node JS
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Log debug information
        run: |
          npm --version
          yarn --version
          node --version
          curl --version
          git --version
          locale -a

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint:js

      - name: Run CSS Lint
        run: yarn lint:css
