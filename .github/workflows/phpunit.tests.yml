name: PHPUnit Tests

on:
  pull_request:
  push:
    branches: [ development ]
  schedule:
    - cron: "15 19 * * 0,3" # Runs early on Monday and Thursday Sydney time

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name for pull requests
  # or the commit hash for any other events.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  GF_LICENSE: ${{ secrets.GF_LICENSE }}

jobs:
  # Only run this action if a Pull Request contains the label 'run-tests'
  check_for_string_in_pull_request_comment:
    name: Should workflow run?
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.event_name == 'pull_request' && ! contains(github.event.pull_request.labels.*.name, 'run-tests') }}
        uses: action-pack/cancel@v1

  test-php:
    name: ${{ matrix.php }}${{ matrix.report && ' coverage' || '' }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # PRs run a tightened matrix (floor / coverage / ceiling) for fast feedback.
        # Push to development/main and the scheduled cron run the full 7-version matrix.
        php: ${{ fromJSON(github.event_name == 'pull_request' && '["7.4","8.3","8.5"]' || '["7.4","8.0","8.1","8.2","8.3","8.4","8.5"]') }}
        os: [ ubuntu-latest ]
        include:
          - php: '8.3'
            os: ubuntu-latest
            report: true
    env:
      WP_ENV_PHP_VERSION: ${{ matrix.php }}

    steps:
      - name: Configure environment variables
        run: |
          echo "PHP_FPM_UID=$(id -u)" >> $GITHUB_ENV
          echo "PHP_FPM_GID=$(id -g)" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 7.4

      - name: Setup Node JS
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Log debug information
        run: |
          npm --version
          yarn --version
          node --version
          curl --version
          git --version
          php --version
          php -i
          locale -a

      - name: Add auth details for private composer packages
        run: composer config http-basic.composer.gravity.io ${{ secrets.GF_LICENSE }} http://localhost

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install Composer dependencies
        run: |
          composer install --no-progress --no-ansi --no-interaction
          echo "${PWD}/vendor/bin" >> $GITHUB_PATH

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache wp-env work directory
        uses: actions/cache@v5
        with:
          path: |
            ~/wp-env
            ~/.wp-env
          key: wp-env-integration-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('tools/wp-env/integration.json', 'composer.lock') }}
          restore-keys: |
            wp-env-integration-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install / Setup Gravity PDF + WordPress
        if: ${{ ! matrix.report }}
        run: yarn wp-env:integration start

      - name: Install / Setup Gravity PDF + WordPress
        if: ${{ matrix.report }}
        run: yarn wp-env:integration start --xdebug=debug

      - name: Run PHPUnit tests
        if: ${{ ! matrix.report }}
        run: |
          yarn test:php --do-not-cache-result --verbose

      # Multisite suite reuses the already-running php 8.3 container instead of
      # spinning up its own matrix cell + cold wp-env start.
      - name: Run Multisite PHPUnit tests
        if: ${{ matrix.php == '8.3' && ! matrix.report }}
        run: |
          yarn test:php:multisite --verbose

      - name: Generate Code Coverage Report for PHP
        if: ${{ matrix.report }}
        run: |  
          yarn test:php --do-not-cache-result --verbose --coverage-clover=/var/www/html/wp-content/plugins/gravity-pdf/tmp/coverage/report-xml/php-coverage1.xml      

      - name: Code Coverage Upload
        uses: codecov/codecov-action@v6
        if: ${{ matrix.report }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          directory: tmp/coverage/report-xml

