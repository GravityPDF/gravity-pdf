name: Build and Package for Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to build and publish (e.g. 6.18.0). A tag of this name is created at the checked-out commit.
        required: true
        type: string

# One run per version, so a re-pushed tag can't race the publish.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref_name }}

jobs:
  package:
    uses: ./.github/workflows/release-package.yml
    with:
      # The pushed tag, or the dispatch input.
      version: ${{ inputs.version || github.ref_name }}
    secrets: inherit

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download package
        uses: actions/download-artifact@v7
        with:
          name: release-package
          path: tmp/package

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          # Explicit so a dispatch creates the version tag instead of targeting the branch ref.
          tag_name: ${{ needs.package.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ./tmp/package/gravity-pdf-*.zip
          generate_release_notes: true
          append_body: true
          prerelease: true
