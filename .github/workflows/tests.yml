name: Tests

on:
  workflow_dispatch:
  pull_request:
    # No `opened`: a PR opened with run-tests fires `labeled` too, and the two runs would cancel each other
    types: [ reopened, synchronize, labeled ]
  # Not `schedule:` — GitHub ran it 2-4h late and skipped whole days. Cronicle
  # (CT 115, https://cron.blueliquiddesigns.com) dispatches it on time instead,
  # at the UTC time below. Change the time there, not here.
  #   cron "0 20 * * *" (UTC) — daily, 6am Sydney AEST (7am during AEDT)

# Any label fires `labeled`, but only these change what the run does (same list as the label check's `if`). Another
# label gets a group of its own, so it can't cancel the run in progress, and the label check skips it
concurrency:
  group: ${{ github.workflow }}-${{ github.event.action == 'labeled' && ! contains(fromJSON('["run-tests","run-tests-php-all","update-visual-baselines"]'), github.event.label.name) && github.run_id || github.head_ref || github.sha }}
  cancel-in-progress: true

# Read-only default; jobs that comment or push ask for more.
permissions:
  contents: read

jobs:
  check_for_run_tests_label_in_pr:
    name: Should workflow run?
    # Same label list as `concurrency.group`
    if: ${{ github.event.action != 'labeled' || contains(fromJSON('["run-tests","run-tests-php-all","update-visual-baselines"]'), github.event.label.name) }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Read live labels via gh-api: the event payload can predate labels added alongside the trigger
      - name: Check for run-tests label
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx 'run-tests'

  # composer.json's post-install-cmd chains `composer prefix` + `yarn install && yarn build`, so composer install plus
  # that script here primes vendor/, vendor_prefixed/, node_modules/, and build/assets/ for every downstream matrix.
  prebuild:
    name: Prebuild shared caches
    needs: check_for_run_tests_label_in_pr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bundled — composer install + the php-scoper post step produce them together; they must invalidate together.
      - name: Check Composer vendor cache
        id: vendor-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendor
            vendor_prefixed
          key: vendor-${{ runner.os }}-${{ hashFiles('composer.lock', 'tools/php-scoper/**') }}
          lookup-only: true

      - name: Check node_modules cache
        id: nm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('yarn.lock', '.nvmrc') }}
          lookup-only: true

      # Lets Playwright shards skip the webpack rebuild.
      - name: Check build assets cache
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/assets
          key: build-${{ runner.os }}-${{ hashFiles('src/assets/**', 'yarn.lock', '.nvmrc', 'package.json', 'babel.config.js', '.browserslistrc') }}
          lookup-only: true

      # 8.3 because this job runs php-scoper, which requires PHP 8.2+. composer.json pins the
      # platform to 7.4, so the resolved dependencies are unaffected by the runtime version.
      - name: Setup PHP
        if: ${{ steps.vendor-cache.outputs.cache-hit != 'true' || steps.nm-cache.outputs.cache-hit != 'true' || steps.build-cache.outputs.cache-hit != 'true' }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.3

      - name: Setup Node JS
        if: ${{ steps.vendor-cache.outputs.cache-hit != 'true' || steps.nm-cache.outputs.cache-hit != 'true' || steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      # The licence is only in this step's env, not an auth.json, so post-install-cmd below doesn't get it in its env.
      - name: Install Composer dependencies
        if: ${{ steps.vendor-cache.outputs.cache-hit != 'true' || steps.nm-cache.outputs.cache-hit != 'true' || steps.build-cache.outputs.cache-hit != 'true' }}
        env:
          COMPOSER_AUTH: '{"http-basic":{"composer.gravity.io":{"username":"${{ secrets.GF_LICENSE }}","password":"http://localhost"}}}'
        run: bash tools/ci/composer-retry.sh install --no-scripts --no-progress --no-ansi --no-interaction

      - name: Run post-install-cmd (php-scoper + yarn install + yarn build)
        if: ${{ steps.vendor-cache.outputs.cache-hit != 'true' || steps.nm-cache.outputs.cache-hit != 'true' || steps.build-cache.outputs.cache-hit != 'true' }}
        run: composer run-script post-install-cmd

      # Save only on success() — install + post-install-cmd produce all three artifacts, so a partway failure
      # could cache incomplete state.
      - name: Save Composer vendor
        if: ${{ steps.vendor-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendor
            vendor_prefixed
          key: ${{ steps.vendor-cache.outputs.cache-primary-key }}

      - name: Save node_modules
        if: ${{ steps.nm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ steps.nm-cache.outputs.cache-primary-key }}

      - name: Save build assets
        if: ${{ steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/assets
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  test-js:
    name: JavaScript Tests
    needs: prebuild
    runs-on: ubuntu-latest
    # The coverage comment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node JS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Log debug information
        run: |
          node --version
          yarn --version

      # Primed by prebuild — a miss here means prebuild itself broke, so fail loudly rather than silently re-installing.
      - name: Restore node_modules
        uses: ./.github/actions/restore-cache
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('yarn.lock', '.nvmrc') }}

      - name: Run Jest tests
        run: yarn test:js:coverage

      - name: Post coverage PR comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: lucassabreu/comment-coverage-clover@9615bdb29755894b53a6e3968619b1e12fac5447 # v0.17.4
        with:
          file: ./tmp/jest-coverage/clover.xml
          signature: ":robot: Jest coverage report"

  test-php:
    name: PHPUnit ${{ matrix.php }}${{ matrix.report && ' coverage' || '' }} on ${{ matrix.os }}
    needs: prebuild
    runs-on: ${{ matrix.os }}
    # The coverage comment.
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        # PRs run a tightened floor/ceiling matrix for fast feedback; scheduled runs get the full matrix down to the
        # composer.json floor. The run-tests-php-all label forces the full matrix on a PR — applied post-open,
        # so the labeled event re-runs this workflow with a payload that carries the label.
        php: ${{ fromJSON((github.event_name == 'pull_request' && ! contains(github.event.pull_request.labels.*.name, 'run-tests-php-all')) && '["7.4","8.5"]' || '["7.4","8.0","8.1","8.2","8.3","8.4","8.5"]') }}
        os: [ ubuntu-latest ]
        include:
          # These flags merge into the matching base cells (no extra cells spawned) and drive the
          # conditional steps below: coverage runs once on 8.3, multisite on the floor + ceiling.
          - php: '8.3'
            os: ubuntu-latest
            report: true
          - php: '7.4'
            os: ubuntu-latest
            multisite: true
          - php: '8.5'
            os: ubuntu-latest
            multisite: true
    env:
      WP_ENV_PHP_VERSION: ${{ matrix.php }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Locks in the static::load_fixtures() contract — the shared $GLOBALS['GFPDF_Test'] global
      # and direct GFAPI form/entry creates have been removed; this gate stops them returning.
      - name: Fail on banned fixture patterns
        run: |
          if grep -rnE "\\\$GLOBALS\\[['\\\"]GFPDF_Test['\\\"]\\]|GFAPI::add_(form|entry)\\b" tests/phpunit/integration/ --include="*.php"; then
            echo "::error::Banned fixture pattern found in tests/phpunit/integration/. Use static::load_fixtures() instead."
            exit 1
          fi

      - name: Set up the job
        uses: ./.github/actions/setup-e2e
        with:
          php-version: ${{ matrix.php }}
          build-assets: false
          playwright: false
          wp-env-config: tools/wp-env/integration.json

      - name: Log debug information
        run: |
          npm --version
          yarn --version
          node --version
          curl --version
          git --version
          php --version
          php -i
          locale -a

      # No restore-keys: the work-dir embeds the downloaded WordPress core, so restoring it across a
      # core-version bump (the key hashes the config) leaves wp-env with a stale WP that silently fails
      # to start. A clean miss re-downloads the pinned version instead.
      - name: Cache wp-env work directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/wp-env
            ~/.wp-env
          key: wp-env-integration-v2-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('tools/wp-env/integration.json', 'composer.lock') }}

      - name: Install / Setup Gravity PDF + WordPress
        if: ${{ ! matrix.report }}
        run: yarn wp-env:integration start

      - name: Install / Setup Gravity PDF + WordPress
        if: ${{ matrix.report }}
        run: yarn wp-env:integration start --xdebug=coverage

      # retry.sh re-runs failed tests once (--filter built from the JUnit XML) so a single transient flake
      # doesn't burn a matrix rerun; retries log as ::warning:: so flakes stay visible.
      - name: Run PHPUnit tests
        if: ${{ ! matrix.report }}
        run: |
          tools/phpunit/retry.sh test:php \
            /var/www/html/wp-content/plugins/gravity-pdf/tmp/junit/phpunit-integration-php${{ matrix.php }}.xml \
            --do-not-cache-result --verbose

      # Multisite-tagged cells (floor + ceiling) reuse their already-running single-site wp-env rather than
      # spinning a dedicated cell. The 8.3 coverage cell runs multisite separately, for the merged report.
      - name: Run Multisite PHPUnit tests
        if: ${{ matrix.multisite }}
        run: |
          tools/phpunit/retry.sh test:php:multisite \
            /var/www/html/wp-content/plugins/gravity-pdf/tmp/junit/phpunit-multisite-php${{ matrix.php }}.xml \
            --verbose

      - name: Generate Code Coverage Report for PHP (single-site)
        if: ${{ matrix.report }}
        run: |
          tools/phpunit/retry.sh test:php \
            /var/www/html/wp-content/plugins/gravity-pdf/tmp/junit/phpunit-coverage-php${{ matrix.php }}.xml \
            --do-not-cache-result --verbose \
            --coverage-clover=/var/www/html/wp-content/plugins/gravity-pdf/tmp/coverage/report-xml/php-coverage1.xml

      - name: Generate Code Coverage Report for PHP (multisite)
        if: ${{ matrix.report }}
        run: |
          tools/phpunit/retry.sh test:php:multisite \
            /var/www/html/wp-content/plugins/gravity-pdf/tmp/junit/phpunit-coverage-multisite-php${{ matrix.php }}.xml \
            --do-not-cache-result --verbose \
            --coverage-clover=/var/www/html/wp-content/plugins/gravity-pdf/tmp/coverage/report-xml/php-coverage-multisite.xml

      - name: Check coverage against the per-directory floor
        if: ${{ matrix.report }}
        run: |
          php tools/phpunit/coverage-baseline.php --floor=tools/phpunit/coverage-floor.json \
            tmp/coverage/report-xml/php-coverage1.xml \
            tmp/coverage/report-xml/php-coverage-multisite.xml

      - name: Upload PHPUnit JUnit timings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: phpunit-junit-php${{ matrix.php }}${{ matrix.report && '-coverage' || '' }}
          path: tmp/junit/*.xml

      - name: Merge single-site + multisite Clover
        if: ${{ matrix.report && github.event_name == 'pull_request' }}
        run: |
          php tools/phpunit/coverage-merge.php \
            tmp/coverage/report-xml/merged.xml \
            tmp/coverage/report-xml/php-coverage1.xml \
            tmp/coverage/report-xml/php-coverage-multisite.xml

      # Custom signature so this comment doesn't collide with test-js' coverage comment — the action keys
      # de-duplication off the signature string, so identical defaults would overwrite each other.
      - name: Post coverage PR comment
        if: ${{ matrix.report && github.event_name == 'pull_request' }}
        uses: lucassabreu/comment-coverage-clover@9615bdb29755894b53a6e3968619b1e12fac5447 # v0.17.4
        with:
          file: tmp/coverage/report-xml/merged.xml
          signature: ":robot: PHPUnit coverage report"

  e2e-playwright:
    name: Playwright E2E Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: prebuild
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4 ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the job
        uses: ./.github/actions/setup-e2e
        with:
          php-version: 7.4

      - name: Log debug information
        run: |
          npm --version
          yarn --version
          node --version
          curl --version
          git --version
          php --version
          php -i
          locale -a

      # No restore-keys: the work-dir embeds the downloaded WordPress core, so restoring it across a
      # core-version bump (the key hashes the config) leaves wp-env with a stale WP that silently fails
      # to start. A clean miss re-downloads the pinned version instead.
      - name: Cache wp-env work directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/wp-env
            ~/.wp-env
          key: wp-env-e2e-v2-${{ runner.os }}-${{ hashFiles('tools/wp-env/e2e.json', 'composer.lock') }}

      - name: Install / Setup Gravity PDF + WordPress
        run: yarn wp-env:e2e start

      # wp-env's work-dir is cached but its MySQL volume isn't, so a restored work-dir can pair with a fresh empty DB.
      # A bare `wp core install` leaves the env half-configured (GF REST never enables), so run wp-env's full reset.
      - name: Ensure WordPress is installed (wp-env cache fallback)
        run: |
          if yarn wp-env:e2e run cli wp core is-installed >/dev/null 2>&1; then
            echo "WordPress already installed."
          else
            echo "wp-env work-dir cache hit a fresh DB volume — running wp-env reset for a full install."
            yarn wp-env:e2e reset
          fi

      - name: Run the tests
        run: yarn test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true

      # One tarball per shard uploads far faster than a folder of PNGs. mkdir covers a shard that took no snapshots.
      - name: Pack visual-regression shots
        if: success()
        run: |
          mkdir -p tmp/visual/current
          tar -C tmp/visual -cf "$RUNNER_TEMP/visual-shots-${{ matrix.shard }}.tar" current

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: visual-shots-${{ matrix.shard }}
          path: ${{ runner.temp }}/visual-shots-${{ matrix.shard }}.tar
          compression-level: 0

      - name: Dump log files on failure
        if: failure()
        run: yarn wp-env:e2e run wordpress "cp" "-r" "/var/www/html/wp-content/uploads/gravity_forms/logs/" "/var/www/html/wp-content/plugins/gravity-pdf/tmp/artifacts/logs"

      - name: Upload artifacts on failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: failure-artifacts-shard-${{ matrix.shard }}
          path: tmp/artifacts

  addon-smoke:
    name: Add-on smoke test
    needs: prebuild
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the job
        uses: ./.github/actions/setup-e2e
        with:
          playwright: false

      - name: Download the released add-ons
        run: bash tools/ci/addons/download.sh
        env:
          GPDF_ADDON_LICENSE: ${{ secrets.GPDF_ADDON_LICENSE }}

      - name: Boot every add-on and load the main pages
        run: bash tools/ci/addons/smoke.sh

      - name: Upload the debug log on failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: addon-smoke-debug-log
          path: tmp/addons/debug.log

  notify:
    name: Notify on scheduled run
    needs: [ test-js, test-php, e2e-playwright, visual-regression, addon-smoke ]
    # The environment only allows development, so a dispatch on another branch skips rather than fails.
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/development' }}
    runs-on: ubuntu-latest
    # Holds SLACK_WEBHOOK_URL.
    environment: development
    env:
      HEADLINE: ${{ (needs.test-js.result == 'success' && needs.test-php.result == 'success' && needs.e2e-playwright.result == 'success' && needs.visual-regression.result == 'success' && needs.addon-smoke.result == 'success') && 'Gravity PDF Tests Completed' || 'Gravity PDF Tests Failed' }}
    steps:
      - name: Post Slack notification for scheduled run
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: "${{ env.HEADLINE }}"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    *${{ env.HEADLINE }}*

                    JavaScript: ${{ needs.test-js.result }}
                    PHPUnit: ${{ needs.test-php.result }}
                    E2E (Playwright): ${{ needs.e2e-playwright.result }}
                    Visual regression: ${{ needs.visual-regression.result }}

                    <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>

  # Lost Pixel (OSS, custom-shots mode) diffs every shard's shots against tests/playwright/visual-baselines. With the
  # `update-visual-baselines` label (plus `run-tests`) it instead refreshes the baselines from this run's shots and
  # commits them to the PR branch with [skip ci]. Needs every shard green, so a refresh never drops a shot.
  visual-regression:
    name: Visual regression
    needs: e2e-playwright
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      UPDATE_BASELINES: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'update-visual-baselines') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.UPDATE_BASELINES == 'true' && github.head_ref || '' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Restore node_modules
        uses: ./.github/actions/restore-cache
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('yarn.lock', '.nvmrc') }}

      - name: Download visual-regression shots from all shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: visual-shots-*
          path: ${{ runner.temp }}/visual-shots
          merge-multiple: true

      # Shot filenames are unique across shards, so every tarball unpacks into the one folder
      - name: Unpack shots
        run: |
          mkdir -p tmp/visual/current
          for f in "$RUNNER_TEMP"/visual-shots/*.tar; do tar -xf "$f" -C tmp/visual; done
          echo "Merged $(find tmp/visual/current -name '*.png' | wc -l) shots"

      # Fails on any shot that drifted past the threshold or has no baseline yet
      - name: Compare against committed baselines
        if: env.UPDATE_BASELINES != 'true'
        run: yarn visual:compare

      - name: Upload visual diffs on failure
        if: failure() && env.UPDATE_BASELINES != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-regression-diffs
          path: |
            tmp/visual/difference
            tmp/visual/current
          if-no-files-found: ignore

      # A full replace also drops baselines whose shot no longer exists; the prune then restores the noise-only rewrites
      - name: Refresh baselines from this run's shots
        if: env.UPDATE_BASELINES == 'true'
        run: |
          rm -f tests/playwright/visual-baselines/*.png
          mkdir -p tests/playwright/visual-baselines
          cp tmp/visual/current/*.png tests/playwright/visual-baselines/
          yarn visual:prune

      - name: Commit refreshed baselines to the PR branch
        if: env.UPDATE_BASELINES == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add tests/playwright/visual-baselines
          if git diff --cached --quiet; then
            echo "Baselines already up to date."
          else
            git commit -m "test(visual): refresh Lost Pixel baselines [skip ci]"
            git push origin "HEAD:$HEAD_REF"
          fi
